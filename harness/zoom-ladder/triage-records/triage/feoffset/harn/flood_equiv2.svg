<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- offset-sourcealpha-flood with a zero blur after the offset (the identity, Filter Effects 1 feGaussianBlur),
       so the harness's drop-shadow idiom (shadow_chain) recognizes the chain and merges it in linearRGB -->
  <filter id="f" x="0%" y="0%" width="100%" height="100%">
    <feOffset in="SourceAlpha" dx="25" dy="25" result="off"/>
    <feGaussianBlur in="off" stdDeviation="0" result="b"/>
    <feFlood flood-color="navy" result="color"/>
    <feComposite in="color" in2="b" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <rect x="20" y="20" width="60" height="60" fill="green" filter="url(#f)"/>
</svg>
