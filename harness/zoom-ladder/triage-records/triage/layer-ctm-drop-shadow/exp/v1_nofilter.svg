  <title>WPT 2d.layer.ctm.ctx-filter</title>
  <html:link rel="match" href="wpt-2d-layer-ctm-drop-shadow-filter-ref.svg"/>
  <defs>
    <filter id="dsRed" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="5" dy="-5" stdDeviation="0" flood-color="red" flood-opacity="1"/>
    </filter>
    <filter id="dsGreen" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="5" dy="-5" stdDeviation="0" flood-color="green" flood-opacity="1"/>
    </filter>
    <filter id="dsBlue" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="2.5" dy="-2.5" stdDeviation="0" flood-color="blue" flood-opacity="1"/>
    </filter>
  </defs>
  <g transform="translate(30, 90) scale(2, 2) rotate(90)">
