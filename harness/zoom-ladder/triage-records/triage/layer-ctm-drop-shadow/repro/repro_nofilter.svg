<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <filter id="f" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feDropShadow dx="5" dy="-5" stdDeviation="0" flood-color="red"/>
  </filter>
  <!-- the rect's edges land on whole device pixels (x 40 and 61), but in the
       user space the filter runs in they sit at half pixels (y = -10.5, 10.5)
       and the user origin sits at (50.5, 50.5) -->
  <g transform="translate(50.5 50.5) rotate(90)">
    <rect x="-30" y="-10.5" width="60" height="21" fill="grey"/>
  </g>
</svg>
