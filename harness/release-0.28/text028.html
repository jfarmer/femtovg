<!doctype html><html><head><meta charset=utf-8><style>
@font-face{font-family:Amiri;src:url(amiri-regular.ttf)}
@font-face{font-family:RobotoFlex;src:url(RobotoFlex-VariableFont.ttf)}
html,body{margin:0;background:#14182b}canvas{display:block}</style></head><body>
<canvas id=c width=600 height=400></canvas><script>
(async()=>{
await Promise.all([document.fonts.load('128px Amiri','مرحبا'),document.fonts.load('28px RobotoFlex','R')]);
const c=document.getElementById('c').getContext('2d');
c.fillStyle='rgb(20,24,43)';c.fillRect(0,0,600,400);
c.save();c.translate(560,150);
c.shadowColor='rgba(64,153,255,0.9)';c.shadowBlur=20;c.shadowOffsetX=8;c.shadowOffsetY=10;
const g=c.createLinearGradient(-440,0,0,0);
g.addColorStop(0,'rgba(255,89,140,0.1)');g.addColorStop(0.5,'rgba(255,166,64,0.7)');g.addColorStop(1,'rgba(255,230,128,1)');
c.fillStyle=g;c.font='112px Amiri';c.textAlign='right';c.fillText('مرحبا بالعالم',0,0);
c.translate(0,90);
c.fillStyle='rgb(235,238,250)';c.font='40px Amiri';c.fillText('النص من اليمين إلى اليسار',0,0);c.shadowColor='rgba(0,0,0,0)';
c.fillStyle='rgb(160,170,200)';c.translate(0,80);c.font='22px RobotoFlex';c.fillText('l'.repeat(78),0,0);c.restore();
c.fillStyle='rgba(255,255,255,0.235)';c.fillRect(574,40,2,320);
document.title='done';
})();
</script></body></html>
