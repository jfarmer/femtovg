  <g transform="translate(55 140) scale(1.5 0.7)"><text x="0" y="10" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="30" fill="#0a4a8a" stroke="#c03000" stroke-width="1.2">Abc</text></g>
  <g transform="translate(145 140) scale(-1 1)"><text x="0" y="10" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="30" fill="#0a4a8a" stroke="#c03000" stroke-width="1.2">Abc</text></g>
